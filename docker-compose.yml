# Full stack: Postgres + API + web. Reads secrets from .env (never committed).
#   docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exportagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exportagent}
      POSTGRES_DB: exportagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exportagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://exportagent:${POSTGRES_PASSWORD:-exportagent}@db:5432/exportagent
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
