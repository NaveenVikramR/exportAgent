# Local full stack: Postgres + API + web, built from source. Reads secrets from .env (never committed).
#   docker compose up --build
# Production (SQLite, prebuilt images, Caddy) is deploy/docker-compose.yml; see DEPLOY.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exportagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exportagent}
      POSTGRES_DB: exportagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exportagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://exportagent:${POSTGRES_PASSWORD:-exportagent}@db:5432/exportagent
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Load the demo inbox (with its cached model responses) into the empty database.
      DEMO_SEED_ON_EMPTY: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
