# Production stack for one small server (t4g.micro, 1 GB RAM + 2 GB swap).
# Images are built by GitHub Actions and pulled from GHCR; this server never builds.
#   docker compose pull && docker compose up -d
# Secrets and the site address come from .env next to this file (see DEPLOY.md).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/naveenvikramr/exportagent-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/exportagent.db
      WEB_ORIGIN: https://${SITE_ADDRESS}
      LLM_MODE: live
      LLM_CACHE_ENABLED: "true"
      DAILY_SPEND_CAP_USD: "1.00"
      RATE_LIMIT_PER_MINUTE: "10"
      DEMO_SEED_ON_EMPTY: "true"
      DEMO_RESET_ENABLED: "true"
      # Only Caddy can reach the API, so trust its X-Forwarded-For for the rate limit.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - data:/data
      - generated:/app/generated
    mem_limit: 450m
    memswap_limit: 900m
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/naveenvikramr/exportagent-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      - api
    mem_limit: 256m
    memswap_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    mem_limit: 128m
    memswap_limit: 256m
    logging: *logging

volumes:
  data:
  generated:
  caddy_data:
  caddy_config:
