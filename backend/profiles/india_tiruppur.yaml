# Factory profile: everything country- or factory-specific lives here, not in code.
# Capacity figures are illustrative for a ~150-person knitwear unit.
id: india_tiruppur
factory: Sri Velan Knits
# signs buyer replies
contact_name: Karthik
contact_role: Merchandiser
city: Tiruppur
country: India
export_currency: USD
default_port: Tuticorin
ports: [Tuticorin, Chennai]
incoterms: [FOB, CFR, CIF]

capacity:
  # sewing output across all lines, pieces per week
  pcs_per_week: 10000
  # share of capacity already booked by orders outside ExportAgent
  baseline_utilisation: 0.6

lead_times:
  # yarn to finished fabric (knitting, dyeing, compacting) before cutting can start
  fabric_days: 42
  # cutting to packed cartons for even a small order
  min_production_days: 10

thresholds:
  # above this share of free capacity the plan is tight
  tight_utilisation: 0.85
  # less spare time than this before ex-factory is tight
  min_slack_days: 7

documents:
  exporter:
    name: Sri Velan Knits
    address: Unit 14, Velan Industrial Park, Tiruppur 641 604, Tamil Nadu, India
  invoice_prefix: SVK/EXP/
  packing_prefix: SVK/PL/
  # The invoice format for exports from India
  format:
    invoice_title: COMMERCIAL INVOICE
    country_of_origin: India
    registration_fields: [IEC Code, GSTIN, AD Code, LUT ARN]
    declarations:
      - Supply meant for export under Letter of Undertaking (LUT) without payment of IGST.
      - We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.
  # Real registration numbers and bank details are deliberately not stored in the demo;
  # every field listed above prints as TO BE CONFIRMED until it is filled in here.
  registration: {}
  bank_fields: [Beneficiary bank, Account number, SWIFT code]
  bank: {}
  packing:
    default_pcs_per_carton: 40
    carton_tare_kg: 0.9
